<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Reflect on the rasas in your week with Natya Lab." />
    <title>Rasa Journal | Natya Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="rasa-journal-page">
    <nav class="nav" aria-label="Main navigation">
      <a class="wordmark" href="./index.html"><strong>Natya</strong><span>Lab</span></a>
      <div class="nav-links">
        <a href="./index.html#about">About</a>
        <a href="./hasta-archive.html">Hasta Archive</a>
        <a href="./hasta-workbook.html">Hasta Workbook</a>
        <a href="./hasta-lab.html">Hasta Lab</a>
        <a href="./rasa-lab.html">Rasa Lab</a>
        <a href="./rasa-journal.html" aria-current="page">Rasa Journal</a>
      </div>
    </nav>

    <main class="rasa-journal texture">
      <header class="rasa-journal-heading">
        <h1><strong>The <span>Rasa</span> Journal:</strong></h1>
        <p>Pick the feeling that matched your week, then tell us the story. We will turn it into movement next class.</p>
      </header>

      <section class="rasa-prompts" aria-label="Rasa journal prompts">
        <article class="rasa-prompt">
          <h2>I felt <span>happy</span></h2>
          <img src="./assets/rasa/illustrations/hasyam.png" alt="Hasyam rasa illustration" />
          <label for="happy-story">Tell your story about a happy moment</label>
          <textarea id="happy-story" rows="4" placeholder="Tell your story..."></textarea>
          <button type="button">Submit your story</button>
        </article>

        <article class="rasa-prompt">
          <h2>I felt <span>scared</span></h2>
          <img src="./assets/rasa/illustrations/bhayanakam.png" alt="Bhayanakam rasa illustration" />
          <label for="scared-story">Tell your story about a scary moment</label>
          <textarea id="scared-story" rows="4" placeholder="Tell your story..."></textarea>
          <button type="button">Submit your story</button>
        </article>

        <article class="rasa-prompt">
          <h2>I was <span>surprised</span></h2>
          <img src="./assets/rasa/illustrations/adbutham.png" alt="Adbutham rasa illustration" />
          <label for="surprised-story">Tell your story about a surprising moment</label>
          <textarea id="surprised-story" rows="4" placeholder="Tell your story..."></textarea>
          <button type="button">Submit your story</button>
        </article>

        <article class="rasa-prompt">
          <h2>I felt <span>peaceful</span></h2>
          <img src="./assets/rasa/illustrations/shantham.png" alt="Shantham rasa illustration" />
          <label for="peaceful-story">Tell your story about a peaceful moment</label>
          <textarea id="peaceful-story" rows="4" placeholder="Tell your story..."></textarea>
          <button type="button">Submit your story</button>
        </article>
      </section>
    </main>
  </body>
</html>
